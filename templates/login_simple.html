<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Login to Automata Tutor</title>
    <!-- Include your main stylesheet if it contains the @keyframes for circles -->
    <link rel="stylesheet" href="/static/css/styles.css"> 
    
    <style>
        /* 1. Base Setup matching Home Screen */
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to left, #8f94fb, #4e54c8);
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent scrollbars from the animations */
        }

        /* 2. The Login Card - Styled like your 'progress-container' */
        .login-card {
            position: relative;
            z-index: 10; /* Ensure it sits above the background circles */
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
            
            /* Glassmorphism Logic from Home Screen */
            background: rgba(255, 255, 255, 0.15); /* Slightly lighter for login */
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 0.8rem;
            color: #fff; /* White text looks better on Glass */
        }

        h1 {
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        p {
            color: #e0e0e0;
            margin-bottom: 25px;
        }

        /* 3. Input Fields */
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* 4. Button - Matching Home styles */
        button {
            width: 100%;
            padding: 12px;
            background-color: rgba(81, 163, 171, 0.8); /* Teal-ish color from home hover */
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        button:hover {
            background-color: rgba(81, 163, 171, 1);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .error {
            color: #ffcccc;
            background-color: rgba(216, 0, 12, 0.2);
            border: 1px solid rgba(216, 0, 12, 0.4);
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            font-size: 14px;
        }

        /* 5. The Animated Background Circles */
        .circles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            z-index: 1; /* Behind the card */
        }

        .circles li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            animation: animate 25s linear infinite;
            bottom: -150px;
        }

        .circles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .circles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .circles li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .circles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .circles li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .circles li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .circles li:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
        .circles li:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
        .circles li:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
        .circles li:nth-child(10){ left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }

        @keyframes animate {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 0;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }
    </style>
</head>

<body>
    <!-- Background Animation -->
    <ul class="circles">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <!-- Login Container -->
    <div class="login-card">
        <h1>Automata ITS</h1>
        <p>Enter your access passkey to continue.</p>

        <form action="/login" method="POST">
            <!-- IMPORTANT: name matches app.py -->
            <input type="password" name="password" placeholder="Passcode" required autofocus>
            <button type="submit">Enter Class</button>
        </form>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
    </div>

</body>
</html>
