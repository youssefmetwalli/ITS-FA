<style>
    :root {
        --shell-width: min(96vw, 1480px);
        --panel-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(245, 250, 255, 0.9));
        --panel-border: rgba(174, 215, 239, 0.44);
        --panel-shadow: 0 18px 42px rgba(10, 42, 69, 0.16);
        --text-main: #173654;
        --text-muted: #5d788f;
        --text-soft: #6d8598;
        --blue-start: #4fc3ff;
        --blue-end: #138de2;
        --green-start: #8ae27a;
        --green-end: #2dbf66;
        --gold-start: #ffcf70;
        --gold-end: #ff934a;
        --violet-start: #b29bff;
        --violet-end: #6378ff;
        --rose-start: #ff9ec5;
        --rose-end: #ff6c8f;
    }

    body {
        min-height: 100vh;
        color: #ebf5ff;
    }

    .dashboard-shell {
        width: var(--shell-width);
        margin: 0 auto 40px auto;
        padding: 20px 0 34px 0;
    }

    .dashboard-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 22px;
        padding: 20px 24px;
        margin-bottom: 24px;
        border-radius: 28px;
        background:
            radial-gradient(circle at right top, rgba(128, 205, 255, 0.22), transparent 30%),
            linear-gradient(135deg, rgba(11, 36, 58, 0.84), rgba(22, 67, 105, 0.75));
        border: 1px solid rgba(177, 223, 248, 0.18);
        box-shadow: 0 22px 52px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(14px);
    }

    .brand-block {
        display: grid;
        gap: 8px;
    }

    .brand-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #9ed4ff;
        font-size: 0.82rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 800;
    }

    .brand-block h1 {
        margin: 0;
        color: #f8fcff;
        font-size: clamp(2rem, 3vw, 2.9rem);
        letter-spacing: -0.05em;
    }

    .brand-copy {
        margin: 0;
        color: rgba(228, 241, 252, 0.84);
        line-height: 1.7;
        max-width: 720px;
    }

    .nav-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
    }

    .nav-button,
    .nav-button-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 17px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 800;
        letter-spacing: 0.01em;
        transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .nav-button {
        color: #0d304d;
        background: linear-gradient(135deg, #ddf4ff, #bde8ff);
        box-shadow: 0 12px 26px rgba(38, 126, 176, 0.22);
    }

    .nav-button-secondary {
        color: #f4f9fd;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .nav-button:hover,
    .nav-button-secondary:hover {
        transform: translateY(-2px);
    }

    .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(340px, 0.98fr);
        gap: 22px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }

    .dashboard-grid h2,
    .dashboard-grid h3,
    .dashboard-grid h4,
    .dashboard-grid .hero-kicker,
    .dashboard-grid .section-kicker,
    .dashboard-grid .metric-card span,
    .dashboard-grid .metric-card strong,
    .dashboard-grid .xp-card strong,
    .dashboard-grid .ring-center strong,
    .dashboard-grid .goal-item strong,
    .dashboard-grid .activity-item strong,
    .dashboard-grid .snapshot-item strong,
    .dashboard-grid .badge-card strong,
    .dashboard-grid .badge-state,
    .dashboard-grid .distribution-head,
    .dashboard-grid .bar-value,
    .dashboard-grid .bar-label,
    .dashboard-grid .momentum-copy span,
    .dashboard-grid .momentum-copy strong,
    .dashboard-grid .momentum-value {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    .dashboard-main,
    .dashboard-side {
        display: grid;
        gap: 22px;
        align-content: start;
    }

    .panel {
        background: var(--panel-bg);
        border-radius: 28px;
        border: 1px solid var(--panel-border);
        box-shadow: var(--panel-shadow);
        padding: 24px;
        color: var(--text-main);
        position: relative;
        overflow: hidden;
    }

    .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent 28%);
        pointer-events: none;
    }

    .hero-panel {
        background:
            radial-gradient(circle at top right, rgba(124, 204, 255, 0.26), transparent 32%),
            radial-gradient(circle at left bottom, rgba(115, 235, 196, 0.18), transparent 26%),
            linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(237, 247, 255, 0.94));
    }

    .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.16fr) minmax(290px, 0.84fr);
        gap: 18px;
        align-items: stretch;
    }

    .hero-kicker,
    .section-kicker {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        padding: 8px 12px;
        border-radius: 999px;
        background: linear-gradient(135deg, #e8f4ff, #ddf6ef);
        color: #245675;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
        margin-bottom: 14px;
    }

    .hero-copy h2,
    .panel h3 {
        margin-top: 0;
        margin-bottom: 10px;
        color: #123a57;
        letter-spacing: -0.035em;
    }

    .hero-copy h2 {
        font-size: clamp(2.1rem, 4vw, 3.2rem);
        line-height: 1.02;
    }

    .hero-copy p,
    .panel-subcopy {
        margin: 0;
        color: var(--text-muted);
        line-height: 1.72;
    }

    .overview-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-top: 20px;
    }

    .metric-card {
        position: relative;
        padding: 18px;
        border-radius: 22px;
        color: #fff;
        box-shadow: 0 18px 30px rgba(16, 59, 91, 0.18);
        transform: translateY(0);
        transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .metric-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 24px 38px rgba(16, 59, 91, 0.22);
    }

    .metric-card span {
        display: block;
        font-size: 0.76rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 800;
        opacity: 0.84;
        margin-bottom: 8px;
    }

    .metric-card strong {
        display: block;
        font-size: clamp(2rem, 3vw, 2.6rem);
        line-height: 1;
        letter-spacing: -0.06em;
        margin-bottom: 10px;
    }

    .metric-card small {
        display: block;
        line-height: 1.55;
        opacity: 0.86;
    }

    .metric-card.xp {
        background: linear-gradient(145deg, var(--blue-start), var(--blue-end));
    }

    .metric-card.level {
        background: linear-gradient(145deg, var(--violet-start), var(--violet-end));
    }

    .metric-card.streak {
        background: linear-gradient(145deg, var(--rose-start), var(--rose-end));
    }

    .metric-card.badges {
        background: linear-gradient(145deg, var(--gold-start), var(--gold-end));
    }

    .xp-card {
        display: grid;
        gap: 14px;
        padding: 22px;
        border-radius: 24px;
        background:
            radial-gradient(circle at top left, rgba(255, 255, 255, 0.16), transparent 30%),
            linear-gradient(160deg, #123a58, #1c5e88 58%, #2480b4);
        color: #ecf7ff;
        box-shadow: 0 18px 34px rgba(18, 67, 103, 0.22);
    }

    .xp-card strong {
        font-size: 1.2rem;
    }

    .xp-bar-shell {
        position: relative;
        height: 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
    }

    .xp-bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #9ce1ff, #ecffff);
        box-shadow: 0 0 26px rgba(156, 225, 255, 0.38);
        transition: width 1.1s cubic-bezier(.2, .8, .2, 1);
    }

    .xp-bar-glow {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
        transform: translateX(-100%);
        animation: barSweep 2.8s ease-in-out infinite;
    }

    @keyframes barSweep {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(20%); }
        100% { transform: translateX(120%); }
    }

    .xp-meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: rgba(239, 248, 255, 0.92);
        font-size: 0.93rem;
    }

    .xp-caption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: rgba(239, 248, 255, 0.84);
        font-size: 0.92rem;
    }

    .section-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
    }

    .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 18px;
        margin-bottom: 14px;
    }

    .tab-toggle {
        display: inline-flex;
        gap: 6px;
        padding: 4px;
        border-radius: 999px;
        background: #e8f1f8;
    }

    .tab-toggle button {
        border: none;
        background: transparent;
        color: #44647c;
        font: inherit;
        font-weight: 800;
        padding: 9px 12px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.18s ease, color 0.18s ease;
    }

    .tab-toggle button.active {
        background: linear-gradient(135deg, #dff3ff, #d8f4ec);
        color: #194767;
    }

    .ring-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
    }

    .ring-card {
        position: relative;
        padding: 16px;
        border-radius: 22px;
        background: linear-gradient(180deg, #f9fcff, #eef7fd);
        border: 1px solid rgba(174, 214, 237, 0.42);
        text-align: center;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .ring-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 16px 28px rgba(24, 73, 109, 0.12);
    }

    .ring-svg {
        width: 132px;
        height: 132px;
        transform: rotate(-90deg);
    }

    .ring-bg {
        fill: none;
        stroke: rgba(28, 92, 132, 0.1);
        stroke-width: 10;
    }

    .ring-meter {
        fill: none;
        stroke-width: 10;
        stroke-linecap: round;
        stroke-dasharray: 301.59;
        stroke-dashoffset: 301.59;
        transition: stroke-dashoffset 1.15s cubic-bezier(.2, .8, .2, 1);
    }

    .ring-figure {
        position: relative;
        width: 132px;
        height: 132px;
        margin: 0 auto 12px auto;
        display: grid;
        place-items: center;
    }

    .ring-center {
        position: absolute;
        display: grid;
        gap: 2px;
        text-align: center;
        color: #143553;
    }

    .ring-center strong {
        font-size: 1.55rem;
        letter-spacing: -0.06em;
    }

    .ring-center small {
        color: var(--text-soft);
        font-size: 0.82rem;
    }

    .ring-card h4 {
        margin: 0 0 6px 0;
        color: #163752;
    }

    .ring-card p {
        margin: 0;
        color: var(--text-soft);
        line-height: 1.55;
        font-size: 0.92rem;
    }

    .goals-list,
    .badge-grid,
    .activity-list,
    .snapshot-list {
        display: grid;
        gap: 12px;
    }

    .goal-item,
    .activity-item,
    .snapshot-item {
        padding: 14px 16px;
        border-radius: 18px;
        background: #f4f9fd;
        border: 1px solid rgba(169, 209, 233, 0.34);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .goal-item:hover,
    .activity-item:hover,
    .snapshot-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(24, 73, 109, 0.08);
    }

    .goal-item.completed {
        background: linear-gradient(160deg, #ebfbef, #e2f6e8);
        border-color: rgba(79, 156, 101, 0.26);
    }

    .goal-head,
    .activity-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
    }

    .goal-item strong,
    .activity-item strong,
    .snapshot-item strong {
        color: #153650;
    }

    .goal-bar {
        margin-top: 10px;
        height: 9px;
        border-radius: 999px;
        background: rgba(31, 91, 130, 0.1);
        overflow: hidden;
    }

    .goal-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #7bc3ff, #4ec9b0);
        transform-origin: left center;
        transform: scaleX(0);
        transition: transform 0.9s cubic-bezier(.2, .8, .2, 1);
    }

    .goals-ready .goal-bar-fill {
        transform: scaleX(1);
    }

    .chart-panel {
        background:
            radial-gradient(circle at top left, rgba(129, 206, 255, 0.16), transparent 28%),
            linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(246, 251, 255, 0.92));
    }

    .chart-switcher {
        display: grid;
        gap: 18px;
    }

    .chart-card {
        display: none;
    }

    .chart-card.active {
        display: block;
    }

    .bar-chart {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 12px;
        align-items: end;
        min-height: 230px;
        padding: 18px 0 4px 0;
    }

    .bar-col {
        display: grid;
        gap: 8px;
        justify-items: center;
        align-content: end;
    }

    .bar-stack {
        width: 100%;
        max-width: 46px;
        height: 180px;
        display: flex;
        align-items: end;
        justify-content: center;
    }

    .bar {
        width: 100%;
        border-radius: 18px 18px 10px 10px;
        min-height: 10px;
        height: 0;
        box-shadow: 0 12px 22px rgba(38, 126, 176, 0.16);
        transition: height 1s cubic-bezier(.2, .8, .2, 1);
    }

    .bars-ready .bar {
        height: var(--bar-height, 0%);
    }

    .bar.xp {
        background: linear-gradient(180deg, var(--blue-start), var(--blue-end));
    }

    .bar.activity {
        background: linear-gradient(180deg, var(--green-start), var(--green-end));
    }

    .bar-value {
        color: #163650;
        font-weight: 800;
        font-size: 0.95rem;
    }

    .bar-label {
        color: var(--text-soft);
        font-size: 0.82rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
    }

    .distribution-grid {
        display: grid;
        gap: 12px;
        padding-top: 6px;
    }

    .distribution-item {
        padding: 14px;
        border-radius: 18px;
        background: #f6fbff;
        border: 1px solid rgba(171, 210, 233, 0.36);
    }

    .distribution-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #163752;
        font-weight: 800;
        margin-bottom: 10px;
    }

    .distribution-track {
        position: relative;
        height: 10px;
        border-radius: 999px;
        background: rgba(23, 83, 121, 0.08);
        overflow: hidden;
    }

    .distribution-fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        transition: width 0.9s cubic-bezier(.2, .8, .2, 1);
    }

    .bars-ready .distribution-fill {
        width: var(--fill-width, 0%);
    }

    .badge-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .badge-card {
        --badge-unlocked-glow: rgba(219, 176, 84, 0.42);
        --badge-unlocked-shadow: rgba(176, 129, 37, 0.12);
        --badge-unlocked-top-glow: rgba(255, 212, 105, 0.36);
        --badge-unlocked-bottom-glow: rgba(255, 237, 186, 0.28);
        --badge-unlocked-bg-start: #fffdf6;
        --badge-unlocked-bg-mid: #fff4db;
        --badge-unlocked-bg-end: #fcedc4;
        --badge-unlocked-icon-start: #fff3c7;
        --badge-unlocked-icon-mid: #ffd974;
        --badge-unlocked-icon-end: #ffc94b;
        --badge-unlocked-icon-color: #8a5b00;
        --badge-unlocked-title: #7d5608;
        --badge-unlocked-body: #866430;
        --badge-unlocked-state: #9b6d09;
        position: relative;
        padding: 16px;
        border-radius: 22px;
        border: 1px solid rgba(164, 207, 232, 0.38);
        background: linear-gradient(180deg, #f9fbff, #eef6fd);
        transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .badge-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 16px 28px rgba(24, 73, 109, 0.12);
    }

    .badge-card.locked {
        opacity: 0.56;
        background: linear-gradient(180deg, #f4f6f8, #eef1f4);
    }

    .badge-card.unlocked {
        background:
            radial-gradient(circle at top right, var(--badge-unlocked-top-glow), transparent 30%),
            radial-gradient(circle at bottom left, var(--badge-unlocked-bottom-glow), transparent 34%),
            linear-gradient(180deg, var(--badge-unlocked-bg-start), var(--badge-unlocked-bg-mid) 68%, var(--badge-unlocked-bg-end));
        border-color: var(--badge-unlocked-glow);
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.92),
            0 16px 30px var(--badge-unlocked-shadow);
    }

    .badge-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #d8f1ff, #dff7f0);
        color: #1d587a;
        font-weight: 900;
        font-size: 0.9rem;
    }

    .badge-icon svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .badge-icon svg.fill-icon {
        fill: currentColor;
        stroke: none;
    }

    .badge-card.locked .badge-icon {
        background: linear-gradient(135deg, #e8ebee, #f1f3f5);
        color: #8c96a0;
    }

    .badge-card.unlocked .badge-icon {
        background: linear-gradient(145deg, var(--badge-unlocked-icon-start), var(--badge-unlocked-icon-mid) 62%, var(--badge-unlocked-icon-end));
        color: var(--badge-unlocked-icon-color);
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.88),
            0 10px 18px rgba(194, 141, 33, 0.18);
    }

    .badge-card.unlocked strong {
        color: var(--badge-unlocked-title);
    }

    .badge-card.unlocked small {
        color: var(--badge-unlocked-body);
    }

    .badge-card small,
    .snapshot-item small,
    .activity-item small,
    .goal-item small {
        color: var(--text-soft);
        line-height: 1.55;
    }

    .badge-state {
        display: inline-flex;
        margin-top: 10px;
        font-size: 0.76rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
        color: #2f6b91;
    }

    .badge-card.locked .badge-state {
        color: #7c8793;
    }

    .badge-card.unlocked .badge-state {
        color: var(--badge-unlocked-state);
    }

    .badge-tone-compass {
        --badge-unlocked-glow: rgba(219, 176, 84, 0.42);
        --badge-unlocked-shadow: rgba(176, 129, 37, 0.12);
        --badge-unlocked-top-glow: rgba(255, 212, 105, 0.36);
        --badge-unlocked-bottom-glow: rgba(255, 237, 186, 0.28);
        --badge-unlocked-bg-start: #fffdf6;
        --badge-unlocked-bg-mid: #fff4db;
        --badge-unlocked-bg-end: #fcedc4;
        --badge-unlocked-icon-start: #fff3c7;
        --badge-unlocked-icon-mid: #ffd974;
        --badge-unlocked-icon-end: #ffc94b;
        --badge-unlocked-icon-color: #8a5b00;
        --badge-unlocked-title: #7d5608;
        --badge-unlocked-body: #866430;
        --badge-unlocked-state: #9b6d09;
    }

    .badge-tone-spark {
        --badge-unlocked-glow: rgba(210, 169, 105, 0.42);
        --badge-unlocked-shadow: rgba(161, 119, 55, 0.12);
        --badge-unlocked-top-glow: rgba(255, 204, 136, 0.34);
        --badge-unlocked-bottom-glow: rgba(255, 235, 204, 0.28);
        --badge-unlocked-bg-start: #fffdf8;
        --badge-unlocked-bg-mid: #fff0dd;
        --badge-unlocked-bg-end: #f9dfbf;
        --badge-unlocked-icon-start: #fff1d8;
        --badge-unlocked-icon-mid: #ffcf8d;
        --badge-unlocked-icon-end: #f5b95d;
        --badge-unlocked-icon-color: #875415;
        --badge-unlocked-title: #7d4f11;
        --badge-unlocked-body: #855f2d;
        --badge-unlocked-state: #965f14;
    }
