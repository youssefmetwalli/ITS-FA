<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automata Chatbot</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>

    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        .chat-container {
            max-width: 80%;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            height: 550px;
            background: rgba(255, 255, 255, 0.15);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 15px;
            max-width: 70%;
            word-wrap: break-word;
            display: inline-block;
        }

        .user-message {
            align-self: flex-end;
            background-color: #d4f0fc;
            color: #000;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #e0f7e9;
            color: #000;
            white-space: pre-wrap;
        }

        .input-container {
            display: flex;
        }

        .input-container input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px 0 0 5px;
        }

        #voiceButton {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #voiceButton:hover {
            background: linear-gradient(45deg, #fad0c4, #ff9a9e);
        }

        #voiceButton svg {
            width: 1.2em;
            height: 1.2em;
            fill: currentColor;
        }

        #sendButton {
            padding: 10px 16px;
            border: 1px solid #ddd;
            border-left: none;
            border-radius: 0 5px 5px 0;
            background: linear-gradient(45deg, #007bff, #009eff);
            color: #fff;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        #sendButton:hover {
            background: linear-gradient(45deg, #0056b3, #007ce0);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #saveButton,
        #loadButton,
        #clearButton {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px 5px;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(45deg, #3b8ee3, #5aa9ed);
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        #saveButton:hover,
        #loadButton:hover,
        #clearButton:hover {
            background: linear-gradient(45deg, #3172c1, #4a8abc);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .pdf-message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            word-wrap: break-word;
            page-break-inside: avoid;
            max-width: 100%;
        }

        .pdf-user-message {
            background-color: #d4f0fc;
            color: #000;
            margin-left: 0;
            margin-right: 0;
        }

        .pdf-bot-message {
            background-color: #e0f7e9;
            color: #000;
            margin-left: 0;
            margin-right: 0;
        }

        @media (max-width: 850px) {
            .header-container {
                width: 100% !important;
            }
        }

        /* Loading overlay styles */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="header-container">
        <h1>Automata Chatbot</h1>
        <a class="button" href="{{ url_for('index') }}">Home</a>
        <a class="button" href="{{ url_for('course_page') }}">Course</a>
        <a class="button" href="/drawer">Practice</a>
    </div>

    <div class="chat-container">
        <div class="messages" id="messages"></div>

        <div class="input-container">
            <button id="voiceButton" title="Speak">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                    <path
                        d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5" />
                    <path d="M10 8a2 2 0 1 1-4 0V3a2 2 0 1 1 4 0zM8 0a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V3a3 3 0 0 0-3-3" />
                </svg>
            </button>
            <input type="text" id="userInput" placeholder="Type a message...">
            <button id="sendButton">Send</button>
        </div>

        <div>
            <button id="saveButton">Save</button>
            <button id="clearButton">Clear</button>
        </div>
    </div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p id="loadingMessage">Filtering automata theory content...</p>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            let messages = [];

            if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
                voiceButton.disabled = true;
                voiceButton.title = "Sorry, this feature is only supported on chrome and edge as of now.";
                return;
            }
            // Speech Recognition setup
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    $('#userInput').val(transcript);
                    sendMessage();
                };
                recognition.onerror = (event) => {
                    console.error('Speech recognition error', event.error);
                };
                $('#voiceButton').click(() => {
                    recognition.start();
                });
            } else {
                $('#voiceButton').attr('disabled', true).attr('title', 'Speech recognition not supported');
            }

            function renderBoldText(text) {
                return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            }

            function typeMessage(element, message, callback) {
                let idx = 0;
                const iv = setInterval(() => {
                    if (idx < message.length) {
                        element.html(message.substring(0, idx + 1));
                        idx++;
                    } else {
                        clearInterval(iv);
                        callback && callback();
                    }
                }, 20);
            }

            function sendMessage() {
                const userInput = $('#userInput').val().trim();
                if (!userInput) return;
                $('#messages').append(
                    `<div class="message user-message">${escapeHtml(userInput)}</div>`
                );
                messages.push({ role: 'user', content: userInput });
                $('#userInput').val('');

                $.ajax({
                    url: '/chat_api',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        chat_history: messages,
                        message: userInput
                    }),
                    success: function (response) {
                        if (response.error) {
                            alert(response.error);
                            return;
                        }
                        const botContainer = $('<div class="message bot-message"></div>');
                        $('#messages').append(botContainer);
                        typeMessage(botContainer, renderBoldText(response.message), function () {
                            $('#messages').scrollTop($('#messages')[0].scrollHeight);
                        });
                        messages.push({ role: 'bot', content: response.message });

                    },
                    error: function (xhr, status, err) {
                        alert('Error: ' + err);
                    }
                });
            }

            $('#sendButton').click(sendMessage);
            $('#userInput').on('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Function to check if a Q&A pair is related to automata theory
            async function isAutomataTheoryRelated(userQuestion, botAnswer) {
                try {
                    const response = await $.ajax({
                        url: '/check_automata_relevance',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            question: userQuestion,
                            answer: botAnswer
                        })
                    });
                    return response.is_relevant;
                } catch (error) {
                    console.error('Error checking relevance:', error);
                    // If there's an error, include the message by default
                    return true;
                }
            }

            $('#saveButton').click(async function () {
                if (messages.length === 0) {
                    alert('No conversation to save!');
                    return;
                }

                const pdfName = prompt("Enter a name for your chat report:", "Automata_Chat_Report");
                if (!pdfName) return;

                try {
                    // Show loading overlay
                    $('#loadingOverlay').css('display', 'flex');
                    $('#loadingMessage').text('Filtering automata theory content...');

                    // Filter messages to only include automata theory related Q&A pairs
                    const filteredMessages = [];
                    for (let i = 0; i < messages.length; i++) {
                        if (messages[i].role === 'user' && i + 1 < messages.length && messages[i + 1].role === 'bot') {
                            const userMsg = messages[i];
                            const botMsg = messages[i + 1];
                            
                            $('#loadingMessage').text(`Analyzing message ${Math.floor(i/2) + 1} of ${Math.floor(messages.length/2)}...`);
                            
                            const isRelevant = await isAutomataTheoryRelated(userMsg.content, botMsg.content);
                            
                            if (isRelevant) {
                                filteredMessages.push(userMsg);
                                filteredMessages.push(botMsg);
                            }
                            i++; // Skip the bot message as we've already processed it
                        }
                    }

                    if (filteredMessages.length === 0) {
                        $('#loadingOverlay').hide();
                        alert('No automata theory related conversations found to export!');
                        return;
                    }

                    $('#loadingMessage').text('Generating PDF...');

                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

                    const pageW = pdf.internal.pageSize.getWidth();
                    const pageH = pdf.internal.pageSize.getHeight();
                    const margin = 20;
                    const usableWidth = pageW - 2 * margin;

                    let currentY = margin;

                    function checkPageBreak(heightNeeded) {
                        if (currentY + heightNeeded > pageH - margin) {
                            pdf.addPage();
                            currentY = margin;
                            return true;
                        }
                        return false;
                    }

                    // REPORT HEADER
                    pdf.setFillColor(52, 152, 219);
                    pdf.rect(0, 0, pageW, 40, 'F');
                    
                    pdf.setTextColor(255, 255, 255);
                    pdf.setFontSize(22);
                    pdf.setFont(undefined, 'bold');
                    pdf.text('Automata Theory Chat Report', pageW / 2, 20, { align: 'center' });
                    
                    pdf.setFontSize(10);
                    pdf.setFont(undefined, 'normal');
                    const date = new Date().toLocaleDateString('en-US', { 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    pdf.text(`Generated on: ${date}`, pageW / 2, 30, { align: 'center' });
                    
                    currentY = 50;

                    // SUMMARY SECTION
                    pdf.setTextColor(0, 0, 0);
                    pdf.setFontSize(12);
                    pdf.setFont(undefined, 'bold');
                    pdf.text('Conversation Summary', margin, currentY);
                    currentY += 8;

                    pdf.setFontSize(10);
                    pdf.setFont(undefined, 'normal');
                    pdf.text(`Total Automata Theory Messages: ${filteredMessages.length}`, margin + 5, currentY);
                    currentY += 6;
                    const userMsgCount = filteredMessages.filter(m => m.role === 'user').length;
                    const botMsgCount = filteredMessages.filter(m => m.role === 'bot').length;
                    pdf.text(`User Questions: ${userMsgCount}`, margin + 5, currentY);
                    currentY += 6;
                    pdf.text(`Bot Responses: ${botMsgCount}`, margin + 5, currentY);
                    currentY += 6;
                    
                    // Add note about filtering
                    pdf.setFontSize(9);
                    pdf.setTextColor(100, 100, 100);
                    pdf.text('(Only automata theory related conversations included)', margin + 5, currentY);
                    pdf.setTextColor(0, 0, 0);
                    currentY += 12;

                    // Divider line
                    pdf.setDrawColor(200, 200, 200);
                    pdf.setLineWidth(0.5);
                    pdf.line(margin, currentY, pageW - margin, currentY);
                    currentY += 10;

                    // CONVERSATION SECTION
                    pdf.setFontSize(12);
                    pdf.setFont(undefined, 'bold');
                    pdf.text('Full Conversation', margin, currentY);
                    currentY += 10;

                    // Process filtered messages
                    let messageNumber = 1;

                    for (let i = 0; i < filteredMessages.length; i++) {
                        const msg = filteredMessages[i];
                        const isUser = msg.role === 'user';
                        const text = msg.content;

                        checkPageBreak(20);
                        
                        const fillR = isUser ? 220 : 224;
                        const fillG = isUser ? 248 : 247;
                        const fillB = isUser ? 198 : 250;
                        pdf.setFillColor(fillR, fillG, fillB);
                        pdf.roundedRect(margin, currentY, usableWidth, 8, 2, 2, 'F');
                        
                        pdf.setFontSize(10);
                        pdf.setFont(undefined, 'bold');
                        const textR = isUser ? 46 : 21;
                        const textG = isUser ? 125 : 101;
                        const textB = isUser ? 50 : 192;
                        pdf.setTextColor(textR, textG, textB);
                        pdf.text(`${messageNumber}. ${isUser ? 'User Question' : 'Bot Response'}`, margin + 3, currentY + 5.5);
                        currentY += 12;

                        pdf.setFont(undefined, 'normal');
                        pdf.setTextColor(0, 0, 0);
                        pdf.setFontSize(10);
                        
                        const textLines = pdf.splitTextToSize(text, usableWidth - 6);
                        
                        textLines.forEach(line => {
                            checkPageBreak(7);
                            pdf.text(line, margin + 3, currentY);
                            currentY += 6;
                        });

                        currentY += 6;
                        
                        if (isUser) {
                            messageNumber++;
                        }
                    }

                    // FOOTER on all pages
                    const totalPages = pdf.internal.getNumberOfPages();
                    for (let i = 1; i <= totalPages; i++) {
                        pdf.setPage(i);
                        pdf.setFontSize(8);
                        pdf.setTextColor(128, 128, 128);
                        pdf.text(`Page ${i} of ${totalPages}`, pageW / 2, pageH - 10, { align: 'center' });
                        pdf.text('Automata Theory Learning Platform', pageW / 2, pageH - 6, { align: 'center' });
                    }

                    pdf.save(`${pdfName}.pdf`);
                    
                    $('#loadingOverlay').hide();
                    alert(`Chat report saved successfully! ${filteredMessages.length / 2} automata theory Q&A pairs included.`);

                } catch (error) {
                    console.error('Error generating PDF:', error);
                    $('#loadingOverlay').hide();
                    alert(`Error generating PDF: ${error.message || error}. Please check the console for more details.`);
                }
            });

            $('#clearButton').click(() => {
                messages = [];
                $('#messages').empty();
            });

            function escapeHtml(txt) {
                return txt
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }
        });
    </script>
</body>

</html>
