<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automata Chatbot</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>

    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        .chat-container {
            width: min(96vw, 1500px);
            max-width: 1500px;
            margin: 20px auto;
            padding: 24px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 180px);
            min-height: 720px;
            background: rgba(255, 255, 255, 0.15);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
        }

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            scroll-behavior: smooth;
            border: 1px solid #ddd;
            padding: 18px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .messages > * {
            flex: 0 0 auto;
        }

        .message {
            padding: 14px 16px;
            border-radius: 15px;
            max-width: min(78%, 980px);
            word-wrap: break-word;
            display: inline-block;
            font-size: 1rem;
            line-height: 1.45;
            flex-shrink: 0;
        }

        .user-message {
            align-self: flex-end;
            background-color: #d4f0fc;
            color: #000;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #e0f7e9;
            color: #000;
            white-space: pre-wrap;
        }

        .question-card {
            align-self: flex-start;
            width: min(980px, 92%);
            min-width: min(720px, 92%);
            padding: 0;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            max-height: min(72vh, 920px);
            background: linear-gradient(160deg, #f9fff4, #eef9ff);
            border: 1px solid rgba(58, 113, 143, 0.22);
            box-shadow: 0 10px 24px rgba(15, 53, 79, 0.16);
            color: #123;
        }

        .question-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #1c6ea4, #3c8dbc);
            color: #fff;
        }

        .question-card-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .question-card-pill {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .question-card-body {
            padding: 18px 18px 20px;
            overflow-y: auto;
            max-height: min(62vh, 760px);
            scrollbar-width: thin;
        }

        .question-card-topic {
            margin-bottom: 10px;
            color: #46606f;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .question-card-prompt {
            margin: 0 0 14px 0;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #0e2533;
            white-space: normal;
        }

        .question-options {
            display: grid;
            gap: 10px;
            margin: 0 0 14px 0;
            padding: 0;
            list-style: none;
        }

        .question-option {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 14px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(63, 106, 130, 0.16);
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            color: #123;
            font-size: 1rem;
            line-height: 1.45;
        }

        .question-option:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(18, 69, 108, 0.12);
            border-color: rgba(28, 110, 164, 0.35);
        }

        .question-option:focus {
            outline: none;
            border-color: rgba(28, 110, 164, 0.55);
            box-shadow: 0 0 0 3px rgba(28, 110, 164, 0.15);
        }

        .question-option.is-submitting {
            opacity: 0.7;
            pointer-events: none;
        }

        .question-option.is-selected {
            border-color: rgba(28, 110, 164, 0.55);
            background: linear-gradient(135deg, #edf8ff, #dff0ff);
            box-shadow: 0 0 0 3px rgba(28, 110, 164, 0.12);
        }

        .question-option.is-correct {
            border-color: rgba(44, 140, 88, 0.55);
            background: linear-gradient(135deg, #eafbf0, #dff7e7);
            box-shadow: 0 0 0 3px rgba(44, 140, 88, 0.14);
        }

        .question-option.is-incorrect {
            border-color: rgba(194, 67, 52, 0.5);
            background: linear-gradient(135deg, #fff1ef, #ffe2dd);
            box-shadow: 0 0 0 3px rgba(194, 67, 52, 0.12);
        }

        .question-card.is-resolved {
            border-color: rgba(63, 106, 130, 0.28);
        }

        .question-result-banner {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .question-result-banner.correct {
            background: linear-gradient(135deg, #e6f8eb, #d8f1df);
            color: #1f6a42;
            border: 1px solid rgba(44, 140, 88, 0.25);
        }

        .question-result-banner.incorrect {
            background: linear-gradient(135deg, #fff2ef, #ffe4de);
            color: #8b3529;
            border: 1px solid rgba(194, 67, 52, 0.22);
        }

        .question-option-label {
            flex: 0 0 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #d7ebf7;
            color: #0d4f74;
            font-weight: 800;
        }

        .question-card-hint {
            padding: 12px 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, #fff6d7, #fff0b8);
            border: 1px solid rgba(195, 155, 59, 0.2);
            color: #5d4a12;
            font-size: 0.92rem;
        }

        .question-card-footer {
            margin-top: 14px;
            color: #38576a;
            font-size: 0.9rem;
            font-weight: 600;
        }

        #chatStatus {
            margin-bottom: 14px !important;
            padding: 14px 16px !important;
            border-radius: 12px !important;
            font-size: 1rem;
            line-height: 1.4;
        }

        .input-container {
            display: flex;
            align-items: stretch;
        }

        .input-container input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 5px 0 0 5px;
            font-size: 1rem;
        }

        #voiceButton {
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #voiceButton:hover {
            background: linear-gradient(45deg, #fad0c4, #ff9a9e);
        }

        #voiceButton svg {
            width: 1.2em;
            height: 1.2em;
            fill: currentColor;
        }

        #sendButton {
            padding: 14px 22px;
            border: 1px solid #ddd;
            border-left: none;
            border-radius: 0 5px 5px 0;
            background: linear-gradient(45deg, #007bff, #009eff);
            color: #fff;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
            font-size: 1rem;
            font-weight: 700;
        }

        #sendButton:hover {
            background: linear-gradient(45deg, #0056b3, #007ce0);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #saveButton,
        #loadButton,
        #clearButton {
            display: inline-block;
            padding: 12px 20px;
            margin: 10px 5px;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(45deg, #3b8ee3, #5aa9ed);
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
            font-size: 0.98rem;
        }

        #saveButton:hover,
        #loadButton:hover,
        #clearButton:hover {
            background: linear-gradient(45deg, #3172c1, #4a8abc);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .pdf-message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            word-wrap: break-word;
            page-break-inside: avoid;
            max-width: 100%;
        }

        .pdf-user-message {
            background-color: #d4f0fc;
            color: #000;
            margin-left: 0;
            margin-right: 0;
        }

        .pdf-bot-message {
            background-color: #e0f7e9;
            color: #000;
            margin-left: 0;
            margin-right: 0;
        }

        @media (max-width: 850px) {
            .header-container {
                width: 100% !important;
            }

            .chat-container {
                width: calc(100vw - 24px);
                height: calc(100vh - 140px);
                min-height: 620px;
                padding: 16px;
            }

            .message {
                max-width: 92%;
            }

            .question-card {
                width: 100%;
                min-width: 0;
                max-height: min(68vh, 820px);
            }

            .question-card-body {
                max-height: min(58vh, 680px);
            }
        }

        /* Loading overlay styles */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="header-container">
        <h1>Automata Chatbot</h1>
        <a class="button" href="{{ url_for('index') }}">Home</a>
        <a class="button" href="{{ url_for('course_page') }}">Course</a>
        <a class="button" href="/drawer">Practice</a>
    </div>

        <div class="chat-container">
            <div class="messages" id="messages"></div>
            <div id="chatStatus" style="display:none; margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,0.25); color: #123;">
            </div>

        <div class="input-container">
            <button id="voiceButton" title="Speak">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                    <path
                        d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5" />
                    <path d="M10 8a2 2 0 1 1-4 0V3a2 2 0 1 1 4 0zM8 0a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V3a3 3 0 0 0-3-3" />
                </svg>
            </button>
            <input type="text" id="userInput" placeholder="Type a message...">
            <button id="sendButton">Send</button>
        </div>

        <div>
            <button id="saveButton">Save</button>
            <button id="clearButton">Clear</button>
        </div>
    </div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p id="loadingMessage">Filtering automata theory content...</p>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            let messages = [];

            if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
                voiceButton.disabled = true;
                voiceButton.title = "Sorry, this feature is only supported on chrome and edge as of now.";
                return;
            }
            // Speech Recognition setup
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    $('#userInput').val(transcript);
                    sendMessage();
                };
                recognition.onerror = (event) => {
                    console.error('Speech recognition error', event.error);
                };
                $('#voiceButton').click(() => {
                    recognition.start();
                });
            } else {
                $('#voiceButton').attr('disabled', true).attr('title', 'Speech recognition not supported');
            }

            function renderBoldText(text) {
                return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            }

            function capitalize(value) {
                if (!value) return '';
                return value.charAt(0).toUpperCase() + value.slice(1);
            }

            function createQuestionCard(response) {
                const question = resolveQuestionData(response);
                if (!question) return null;

                $('.question-card').removeClass('is-active-question');
                const card = $('<div class="question-card is-active-question"></div>');
                const conceptTags = Array.isArray(question.concept_tags) ? question.concept_tags.filter(Boolean) : [];
                const topic = conceptTags.length ? conceptTags.join(', ') : 'Automata theory';
                const typeLabel = question.type === 'mcq' ? 'MCQ' : 'Short Answer';
                const normalizedCorrectAnswer = normalizeAnswerValue(question.correct_answer || '');
                card.attr('data-question-id', question.question_id || '');
                card.attr('data-question-type', question.type || '');
                card.attr('data-correct-answer', normalizedCorrectAnswer);

                const header = $(`
                    <div class="question-card-header">
                        <div class="question-card-title">Practice Question</div>
                        <div class="question-card-pill">${escapeHtml(typeLabel)} · ${escapeHtml(capitalize(question.difficulty || 'medium'))}</div>
                    </div>
                `);

                const body = $('<div class="question-card-body"></div>');
                body.append(`<div class="question-card-topic">Topic: ${escapeHtml(topic)}</div>`);
                body.append(`<p class="question-card-prompt">${escapeHtml(question.prompt || '')}</p>`);

                if (Array.isArray(question.options) && question.options.length) {
                    const options = $('<ul class="question-options"></ul>');
                    question.options.forEach((option, index) => {
                        const label = String.fromCharCode(65 + index);
                        options.append(`
                            <li>
                                <button
                                    type="button"
                                    class="question-option"
                                    data-answer-label="${escapeHtml(label)}"
                                    data-answer-text="${escapeHtml(option)}"
                                    data-answer-normalized="${escapeHtml(normalizeAnswerValue(option))}"
                                >
                                    <span class="question-option-label">${label}</span>
                                    <span>${escapeHtml(option)}</span>
                                </button>
                            </li>
                        `);
                    });
                    body.append(options);
                }

                if (question.hint) {
                    body.append(`<div class="question-card-hint"><strong>Hint:</strong> ${escapeHtml(question.hint)}</div>`);
                }

                body.append('<div class="question-card-footer">Reply with your answer in the chat and I will evaluate it.</div>');
                card.append(header, body);

                return card;
            }

            function resolveQuestionData(response) {
                if (response.question_metadata) {
                    return response.question_metadata;
                }

                if (
                    response.agent_payload &&
                    Array.isArray(response.agent_payload.questions) &&
                    response.agent_payload.questions.length > 0
                ) {
                    return response.agent_payload.questions[0];
                }

                return null;
            }

            function normalizeAnswerValue(value) {
                return String(value || '')
                    .trim()
                    .toLowerCase()
                    .replace(/^[a-d](?:[\).:\s-]+)/, '')
                    .replace(/\s+/g, ' ');
            }

            function appendBotTextMessage(text) {
                const botContainer = $('<div class="message bot-message"></div>');
                $('#messages').append(botContainer);
                typeMessage(botContainer, renderBoldText(text), function () {
                    $('#messages').scrollTop($('#messages')[0].scrollHeight);
                });
            }

            function getActiveQuestionCard() {
                const activeCard = $('#messages .question-card.is-active-question').last();
                if (activeCard.length) {
                    return activeCard;
                }
                return $('#messages .question-card').last();
            }

            function updateQuestionCardWithDiagnosis(response) {
                const card = getActiveQuestionCard();
                if (!card.length) {
                    return;
                }

                const diagnosis = response.agent_payload || {};
                const isCorrect = Boolean(diagnosis.is_correct);
                const selectedAnswer = normalizeAnswerValue(card.attr('data-selected-answer'));
                const correctAnswer = normalizeAnswerValue(card.attr('data-correct-answer'));
                const optionButtons = card.find('.question-option');

                optionButtons.each(function () {
                    const button = $(this);
                    const answerLabel = normalizeAnswerValue(button.data('answer-label'));
                    const answerText = normalizeAnswerValue(button.data('answer-normalized') || button.data('answer-text'));
                    const matchesSelection = selectedAnswer && (selectedAnswer === answerLabel || selectedAnswer === answerText);
                    const matchesCorrect = correctAnswer && (correctAnswer === answerLabel || correctAnswer === answerText);

                    button.removeClass('is-submitting');

                    if (matchesSelection) {
                        button.addClass('is-selected');
                    }
                    if (matchesCorrect) {
                        button.addClass('is-correct');
                    }
                    if (matchesSelection && !isCorrect) {
                        button.addClass('is-incorrect');
                    }
                    button.prop('disabled', true);
                });

                card.removeClass('is-active-question').addClass('is-resolved');
                card.find('.question-result-banner').remove();

                const bannerClass = isCorrect ? 'correct' : 'incorrect';
                const bannerText = isCorrect ? 'Correct choice recorded.' : 'Your selected option was incorrect. The correct option is highlighted.';
                card.find('.question-card-body').append(
                    `<div class="question-result-banner ${bannerClass}">${escapeHtml(bannerText)}</div>`
                );
            }

            function appendExaminerMessage(response) {
                const question = resolveQuestionData(response);
                const introText = extractExaminerIntro(response, question);

                if (!question) {
                    appendBotTextMessage(introText);
                    return;
                }

                const introContainer = $('<div class="message bot-message"></div>');
                $('#messages').append(introContainer);
                typeMessage(introContainer, renderBoldText(introText), function () {
                    try {
                        const questionCard = createQuestionCard(response);
                        if (questionCard) {
                            $('#messages').append(questionCard);
                        } else {
                            appendBotTextMessage('I prepared a question, but the card view could not be displayed.');
                        }
                    } catch (error) {
                        console.error('Question card render failed:', error);
                        appendBotTextMessage('I prepared a question, but the card view failed, so answer using the prompt above.');
                    }
                    $('#messages').scrollTop($('#messages')[0].scrollHeight);
                });
            }

            function extractExaminerIntro(response, question) {
                const fallbackIntro = 'Here is a practice question.';
                const fullText = response.response_text || response.message || fallbackIntro;
                if (!question) {
                    return fullText;
                }

                const markers = [
                    '**Question',
                    'Question 1 (',
                    question.prompt || ''
                ].filter(Boolean);

                let cutIndex = fullText.length;
                markers.forEach(marker => {
                    const index = fullText.indexOf(marker);
                    if (index !== -1 && index < cutIndex) {
                        cutIndex = index;
                    }
                });

                const intro = fullText.slice(0, cutIndex).trim();
                return intro || fallbackIntro;
            }

            function renderResponseMeta(response) {
                const metaLines = [];
                if (response.agent_used) {
                    metaLines.push(`<strong>Agent:</strong> ${escapeHtml(response.agent_used)}`);
                }
                if (response.has_active_question && response.question_metadata) {
                    metaLines.push(`<strong>Active question:</strong> ${escapeHtml(response.question_metadata.type)} • ${escapeHtml(response.question_metadata.difficulty)}`);
                }
                if (response.suggested_next_action) {
                    metaLines.push(`<strong>Next:</strong> ${escapeHtml(response.suggested_next_action)}`);
                }

                if (metaLines.length === 0) {
                    $('#chatStatus').hide().empty();
                    return;
                }

                $('#chatStatus').html(metaLines.join('<br>')).show();
            }

            function typeMessage(element, message, callback) {
                let idx = 0;
                const iv = setInterval(() => {
                    if (idx < message.length) {
                        element.html(message.substring(0, idx + 1));
                        idx++;
                    } else {
                        clearInterval(iv);
                        callback && callback();
                    }
                }, 20);
            }

            function sendMessage(prefilledMessage = null) {
                const userInput = prefilledMessage !== null ? String(prefilledMessage).trim() : $('#userInput').val().trim();
                if (!userInput) return;
                $('#messages').append(
                    `<div class="message user-message">${escapeHtml(userInput)}</div>`
                );
                messages.push({ role: 'user', content: userInput });
                if (prefilledMessage === null) {
                    $('#userInput').val('');
                } else {
                    $('#userInput').val('');
                }

                $.ajax({
                    url: '/chat_api',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        chat_history: messages,
                        message: userInput
                    }),
                    success: function (response) {
                        if (response.error) {
                            alert(response.error);
                            return;
                        }
                        renderResponseMeta(response);
                        if (response.agent_used === 'examiner') {
                            appendExaminerMessage(response);
                        } else {
                            appendBotTextMessage(response.response_text || response.message);
                            if (response.agent_used === 'diagnoser') {
                                updateQuestionCardWithDiagnosis(response);
                            }
                        }
                        messages.push({ role: 'bot', content: response.response_text || response.message });

                    },
                    error: function (xhr, status, err) {
                        alert('Error: ' + err);
                    }
                });
            }

            $('#sendButton').click(sendMessage);
            $('#userInput').on('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            $('#messages').on('click', '.question-option', function () {
                const optionButton = $(this);
                const answerLabel = optionButton.data('answer-label');
                const questionCard = optionButton.closest('.question-card');

                if (!answerLabel) {
                    return;
                }

                questionCard.find('.question-option').removeClass('is-selected is-submitting');
                optionButton.addClass('is-selected is-submitting');
                questionCard.attr('data-selected-answer', normalizeAnswerValue(answerLabel));
                questionCard.find('.question-option').prop('disabled', true);
                sendMessage(answerLabel);
            });

            // Function to check if a Q&A pair is related to automata theory
            async function isAutomataTheoryRelated(userQuestion, botAnswer) {
                try {
                    const response = await $.ajax({
                        url: '/check_automata_relevance',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            question: userQuestion,
                            answer: botAnswer
                        })
                    });
                    return response.is_relevant;
                } catch (error) {
                    console.error('Error checking relevance:', error);
                    // If there's an error, include the message by default
                    return true;
                }
            }
            $('#saveButton').click(async function () {
                if (messages.length === 0) {
                    alert('No conversation to save!');
                    return;
                }

                const pdfName = prompt("Enter a name for your chat report:", "Automata_Chat_Report");
                if (!pdfName) return;

                try {
                    // Show loading overlay
                    $('#loadingOverlay').css('display', 'flex');
                    $('#loadingMessage').text('Filtering automata theory content...');

                    // Filter messages
                    const filteredMessages = [];
                    for (let i = 0; i < messages.length; i++) {
                        if (messages[i].role === 'user' && i + 1 < messages.length && messages[i + 1].role === 'bot') {
                            const userMsg = messages[i];
                            const botMsg = messages[i + 1];

                            $('#loadingMessage').text(`Analyzing message ${Math.floor(i / 2) + 1} of ${Math.floor(messages.length / 2)}...`);

                            const isRelevant = await isAutomataTheoryRelated(userMsg.content, botMsg.content);

                            if (isRelevant) {
                                filteredMessages.push(userMsg);
                                filteredMessages.push(botMsg);
                            }
                            i++;
                        }
                    }

                    if (filteredMessages.length === 0) {
                        $('#loadingOverlay').hide();
                        alert('No automata theory related conversations found to export!');
                        return;
                    }

                    $('#loadingMessage').text('Generating PDF...');

                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

                    const pageW = pdf.internal.pageSize.getWidth();
                    const pageH = pdf.internal.pageSize.getHeight();
                    const margin = 20;
                    const usableWidth = pageW - 2 * margin;

                    let currentY = margin;

                    function checkPageBreak(heightNeeded) {
                        if (currentY + heightNeeded > pageH - margin) {
                            pdf.addPage();
                            currentY = margin;
                            return true;
                        }
                        return false;
                    }

                    // REPORT HEADER
                    pdf.setFillColor(52, 152, 219);
                    pdf.rect(0, 0, pageW, 40, 'F');

                    pdf.setTextColor(255, 255, 255);
                    pdf.setFontSize(22);
                    pdf.setFont(undefined, 'bold');
                    pdf.text('Automata Theory Chat Report', pageW / 2, 20, { align: 'center' });

                    pdf.setFontSize(10);
                    pdf.setFont(undefined, 'normal');
                    const date = new Date().toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    pdf.text(`Generated on: ${date}`, pageW / 2, 30, { align: 'center' });

                    currentY = 50;

                    // SUMMARY SECTION
                    pdf.setTextColor(0, 0, 0);
                    pdf.setFontSize(12);
                    pdf.setFont(undefined, 'bold');
                    pdf.text('Conversation Summary', margin, currentY);
                    currentY += 8;

                    pdf.setFontSize(10);
                    pdf.setFont(undefined, 'normal');
                    pdf.text(`Total Automata Theory Messages: ${filteredMessages.length}`, margin + 5, currentY);
                    currentY += 6;
                    const userMsgCount = filteredMessages.filter(m => m.role === 'user').length;
                    const botMsgCount = filteredMessages.filter(m => m.role === 'bot').length;
                    pdf.text(`User Questions: ${userMsgCount}`, margin + 5, currentY);
                    currentY += 6;
                    pdf.text(`Bot Responses: ${botMsgCount}`, margin + 5, currentY);
                    currentY += 6;

                    pdf.setFontSize(9);
                    pdf.setTextColor(100, 100, 100);
                    pdf.text('(Only automata theory related conversations included)', margin + 5, currentY);
                    pdf.setTextColor(0, 0, 0);
                    currentY += 12;

                    // Divider line
                    pdf.setDrawColor(200, 200, 200);
                    pdf.setLineWidth(0.5);
                    pdf.line(margin, currentY, pageW - margin, currentY);
                    currentY += 6;

                    // CONVERSATION SECTION
                    let messageNumber = 1;

                    for (let i = 0; i < filteredMessages.length; i++) {
                        const msg = filteredMessages[i];
                        const isUser = msg.role === 'user';
                        const text = msg.content;

                        if (isUser) {
                            // --- MODIFIED: Bigger Font and Bold for Questions ---
                            checkPageBreak(15);

                            pdf.setFontSize(14); // Changed from 12
                            pdf.setFont(undefined, 'bold'); // Changed from 'normal'
                            pdf.setTextColor(0, 0, 0);

                            const questionText = `Q${messageNumber}: ${text}`;
                            const questionLines = pdf.splitTextToSize(questionText, usableWidth);

                            questionLines.forEach(line => {
                                checkPageBreak(8); // Slightly more space for bigger font
                                pdf.text(line, margin, currentY);
                                currentY += 4;
                            });

                            pdf.setDrawColor(0, 0, 0);
                            pdf.setLineWidth(0.3);
                            pdf.line(margin, currentY, pageW - margin, currentY);
                            currentY += 6; // Increased spacing slightly
                        } else {
                            // --- MODIFIED: Flow-based text rendering to fix the * line skip ---
                            checkPageBreak(10);

                            pdf.setTextColor(0, 0, 0);
                            pdf.setFontSize(10);

                            // 1. Parse Segments (Bold vs Normal)
                            const boldPattern = /\*\*(.*?)\*\*/g;
                            const segments = [];
                            let lastIndex = 0;
                            let match;

                            while ((match = boldPattern.exec(text)) !== null) {
                                if (match.index > lastIndex) {
                                    segments.push({ text: text.substring(lastIndex, match.index), bold: false });
                                }
                                segments.push({ text: match[1], bold: true });
                                lastIndex = match.index + match[0].length;
                            }
                            if (lastIndex < text.length) {
                                segments.push({ text: text.substring(lastIndex), bold: false });
                            }
                            if (segments.length === 0) {
                                segments.push({ text: text, bold: false });
                            }

                            // 2. Render Text Flow
                            let cursorX = margin;
                            const lineHeight = 4;

                            segments.forEach(segment => {
                                pdf.setFont(undefined, segment.bold ? 'bold' : 'normal');

                                // Split segment by explicit newlines first
                                const lines = segment.text.split('\n');

                                lines.forEach((line, lineIdx) => {
                                    // If we hit a newline in the source text, move cursor down
                                    if (lineIdx > 0) {
                                        currentY += lineHeight;
                                        cursorX = margin;
                                        checkPageBreak(lineHeight);
                                    }

                                    // Split the current line into words/spaces to handle wrapping
                                    // The regex splits by whitespace but keeps the delimiter
                                    const words = line.split(/(\s+)/);

                                    words.forEach(word => {
                                        const wordWidth = pdf.getTextWidth(word);

                                        // Check if word fits on current line
                                        if (cursorX + wordWidth > margin + usableWidth) {
                                            currentY += lineHeight;
                                            cursorX = margin;
                                            checkPageBreak(lineHeight);
                                            // If the wrapping word is just a space, ignore it on new line
                                            if (/^\s+$/.test(word)) return;
                                        }

                                        pdf.text(word, cursorX, currentY);
                                        cursorX += wordWidth;
                                    });
                                });
                            });

                            currentY += 10;
                            messageNumber++;
                        }
                    }

                    // FOOTER
                    const totalPages = pdf.internal.getNumberOfPages();
                    for (let i = 1; i <= totalPages; i++) {
                        pdf.setPage(i);
                        pdf.setFontSize(8);
                        pdf.setTextColor(128, 128, 128);
                        pdf.text(`Page ${i} of ${totalPages}`, pageW / 2, pageH - 10, { align: 'center' });
                        pdf.text('Automata Theory Learning Platform', pageW / 2, pageH - 6, { align: 'center' });
                    }

                    pdf.save(`${pdfName}.pdf`);

                    $('#loadingOverlay').hide();
                    alert(`Chat report saved successfully! ${filteredMessages.length / 2} automata theory Q&A pairs included.`);

                } catch (error) {
                    console.error('Error generating PDF:', error);
                    $('#loadingOverlay').hide();
                    alert(`Error generating PDF: ${error.message || error}`);
                }
            });

            $('#clearButton').click(() => {
                messages = [];
                $('#messages').empty();
                $('#chatStatus').hide().empty();
                $.ajax({
                    url: '/chat_api/reset',
                    method: 'POST'
                });
            });

            function escapeHtml(txt) {
                return txt
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }
        });
    </script>
</body>

</html>
